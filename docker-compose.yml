# MyBlog Docker Compose
# 模式 A（全套，含 MySQL）：       docker compose --profile bundled up -d
# 模式 B（复用服务器已有 MySQL）：  docker compose up -d server nginx
#   并通过 .env / 环境变量覆盖 BLOG_MYSQL_DSN（见 docs/03-部署文档.md）

services:
  mysql:
    image: mysql:8.0
    profiles: ["bundled"] # 仅模式 A 启用；模式 B 跳过
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: myblog
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  server:
    build: ./server
    environment:
      BLOG_PORT: "8080"
      BLOG_DB_TYPE: mysql
      # DSN 完全由 .env 提供（模板见 .env.example）：模式 A 用默认 mysql:3306，模式 B 指向已有 MySQL
      BLOG_MYSQL_DSN: ${BLOG_MYSQL_DSN:?请在 .env 中设置 BLOG_MYSQL_DSN（cp .env.example .env 后按需修改）}
      BLOG_JWT_SECRET: ${BLOG_JWT_SECRET:?请在 .env 中设置 BLOG_JWT_SECRET}
      # 敏感字段（评论邮箱/IP、管理员邮箱）静态加密密钥；留空则自动生成并持久化到 /app/data
      BLOG_CRYPTO_KEY: ${BLOG_CRYPTO_KEY:-}
    volumes:
      - upload-data:/app/uploads
      - server-data:/app/data
    # 安全：API 不映射到宿主机端口，仅 docker 内网可达（nginx 反代访问）
    expose:
      - "8080"
    depends_on:
      mysql:
        # required:false：模式 B（无 bundled mysql）时跳过该依赖
        condition: service_healthy
        required: false
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    # 安全：默认仅绑定宿主机回环地址（本机/SSH 隧道可访问，外网不可达）。
    # 需要局域网访问时在 .env 设置 BLOG_BIND=<内网IP，如 192.168.1.10>；
    # 切勿设为 0.0.0.0（等于向公网开放）。
    ports:
      - "${BLOG_BIND:-127.0.0.1}:80:80" # 前台
      - "${BLOG_BIND:-127.0.0.1}:8081:8081" # 管理端
    depends_on:
      - server
    restart: unless-stopped

volumes:
  mysql-data:
  upload-data:
  server-data:
