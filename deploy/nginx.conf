# MyBlog 门户 nginx 配置（deploy/Dockerfile 拷入 /etc/nginx/conf.d/default.conf）
# 80  = 前台（web dist）    8081 = 管理端（admin dist）
# /api /uploads /rss 反向代理到后端容器 server:8080

# 上传体积上限（后端单文件上限 10MB，此处放宽到 20m 覆盖 multipart 开销）
client_max_body_size 20m;

# ---------- 前台：80 ----------
server {
	listen 80;
	server_name _;

	root /usr/share/nginx/html/web;
	index index.html;

	gzip on;
	gzip_types text/css application/javascript application/json image/svg+xml;
	gzip_min_length 1024;

	# SPA 路由回退
	location / {
		try_files $uri $uri/ /index.html;
	}

	location /api/ {
		proxy_pass http://server:8080;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location /uploads/ {
		proxy_pass http://server:8080;
		proxy_set_header Host $host;
	}

	location = /rss {
		proxy_pass http://server:8080;
		proxy_set_header Host $host;
	}

	# SEO：站点地图与爬虫规则由后端动态生成
	location = /sitemap.xml {
		proxy_pass http://server:8080;
		proxy_set_header Host $host;
	}

	location = /robots.txt {
		proxy_pass http://server:8080;
		proxy_set_header Host $host;
	}
}

# ---------- 管理端：8081 ----------
server {
	listen 8081;
	server_name _;

	root /usr/share/nginx/html/admin;
	index index.html;

	client_max_body_size 20m;

	gzip on;
	gzip_types text/css application/javascript application/json image/svg+xml;
	gzip_min_length 1024;

	location / {
		try_files $uri $uri/ /index.html;
	}

	location /api/ {
		proxy_pass http://server:8080;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location /uploads/ {
		proxy_pass http://server:8080;
		proxy_set_header Host $host;
	}
}
